<!--this is just a practice testing for java script and html with some css styling.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>!!Changing Themes!!</title>

  <!-- 1. STYLESHEET LINK: Tells the browser to download and apply our CSS file -->
  <link rel="stylesheet" href="new.css">

  <!-- 2. ICON LINK: Sets the small icon shown in the browser tab -->
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/1006/1006771.png">

  <!-- 3. PRECONNECT & FONT LINK: Speeds up loading Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">

  <!-- 4. CANONICAL LINK: Tells search engines the original/preferred URL of this page -->
  <link rel="canonical" href="https://example.com/demo-page">
</head>
<body>

  <div class="card">
    <h1 id="title">HTML, CSS & JavaScript Connected!</h1>
    <p>This box is styled by <code>new.css</code> linked via <code>&lt;link rel="stylesheet" href="new.css"&gt;</code>.</p>
    
    <button id="changeBtn">Click to change theme</button>
  </div>

  <!-- JAVASCRIPT LINK: Connected using the <script> tag -->
  <script src="script.js"></script>
</body>
</html>
